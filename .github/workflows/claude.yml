name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Project setup
        run: |
          npm run setup
          npm run dev:daemon
      - uses: anthropics/claude-code-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          custom_instructions: |
            the project already setup with all dependencies installed.
            the server already running at localhost:3000. logs from it are being written to logs.txt. if needed, you can query the db with the 'sqlite3' cli. if needed, use the mcp__playwright set of tools to launch a browser and interact with app.
          mcp_config: |
            {
              "playwright": {
                "command": "npx",
                "args": ["playwright/mcp@latest", "--allowed-origins", "http://localhost:3000,cdn.tailwindcss.com,esm.sh"]
              }
            }
          allowed_tools: "bash(npm:*),bash(sqlite3:*),mcp__playwright__browser__snapshot,mcp__playwright__browser__html,mcp__playwright__browser__screenshot"
