name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Project setup
        run: |
          npm run setup
          npm run dev:daemon > logs.txt 2>&1 &
          echo "Waiting for dev server..."
          timeout 60 bash -c 'until curl -sf http://localhost:3000 > /dev/null; do sleep 2; done'
          echo "Dev server ready"
      - uses: anthropics/claude-code-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          custom_instructions: |
            The project is already set up with all dependencies installed.
            The dev server is running at http://localhost:3000. Its logs are written to logs.txt.
            If needed, query the database with the sqlite3 CLI (db path: prisma/dev.db).
            Use the mcp__playwright__* tools to launch a browser and interact with the app.
          mcp_config: |
            {
              "playwright": {
                "command": "npx",
                "args": [
                  "@playwright/mcp@latest",
                  "--allowed-origins",
                  "http://localhost:3000;https://cdn.tailwindcss.com;https://esm.sh"
                ]
              }
            }
          allowed_tools: >-
            bash(npm:*),
            bash(sqlite3:*),
            bash(curl:*),
            mcp__playwright__browser_navigate,
            mcp__playwright__browser_snapshot,
            mcp__playwright__browser_take_screenshot,
            mcp__playwright__browser_click,
            mcp__playwright__browser_type,
            mcp__playwright__browser_fill_form,
            mcp__playwright__browser_hover,
            mcp__playwright__browser_press_key,
            mcp__playwright__browser_select_option,
            mcp__playwright__browser_evaluate,
            mcp__playwright__browser_console_messages,
            mcp__playwright__browser_network_requests,
            mcp__playwright__browser_wait_for,
            mcp__playwright__browser_resize,
            mcp__playwright__browser_tabs,
            mcp__playwright__browser_navigate_back,
            mcp__playwright__browser_close
